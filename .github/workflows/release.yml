name: Pubblica release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '9.0.x'
      - name: Ripristina dipendenze
        run: dotnet restore src/VibraVidPanel/VibraVidPanel.csproj
      - name: Compila
        run: dotnet publish src/VibraVidPanel/VibraVidPanel.csproj -c Release --no-restore -o build
      - name: Crea pacchetti e manifest
        run: python3 scripts/package_release.py --output dist --repository "$GITHUB_REPOSITORY"
      - name: Verifica distribuzione
        run: python3 scripts/verify_release.py dist
      - name: Pubblica la release richiesta
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish_release.py dist
