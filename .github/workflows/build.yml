name: Compila e verifica

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '9.0.x'
      - name: Ripristina dipendenze
        run: dotnet restore src/VibraVidPanel/VibraVidPanel.csproj
      - name: Compila
        run: dotnet publish src/VibraVidPanel/VibraVidPanel.csproj -c Release --no-restore -o build
      - name: Crea pacchetti
        run: python3 scripts/package_release.py --output dist
      - name: Verifica distribuzione
        run: python3 scripts/verify_release.py dist
